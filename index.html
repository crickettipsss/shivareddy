 display:flex;

 margin:0 auto 22px;

.logo img{

.verified{

.fire{font-size:34px;margin-bottom:18px}
.description{
 color:#aab4c4;font-size:16px;
 line-height:1.65;margin-bottom:25px;
}
.join{
 width:100%;min-height:60px;
 display:flex;justify-content:center;
 align-items:center;gap:12px;
 border-radius:23px;
 background:linear-gradient(100deg,#04a9ed,#08c3e9);
 color:white;text-decoration:none;font-size:19px;
}
.join svg{width:25px;height:25px;fill:white}
.access{color:#8491a2;font-size:14px;margin-top:19px}
hr{border:0;border-top:1px solid #293744;margin:29px 0 20px}
.footer{color:#8290a0;font-size:13px;line-height:1.5}
